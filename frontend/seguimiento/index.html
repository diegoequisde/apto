<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APTO | Seguimiento</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div id="navbar"></div>


<main class="container">


<section class="page-header">

<h1>Seguimiento</h1>

<p>Consulta tu evolución y rendimiento.</p>

</section>


<!-- RESUMEN -->

<section>

<h2>Resumen</h2>

<div class="summary-grid">

    <article class="summary-card">
        <strong>Racha</strong>
        <span>7 días</span>
    </article>


    <article class="summary-card">
        <strong>Tests realizados</strong>
        <span>25</span>
    </article>


    <article class="summary-card">
        <strong>Preguntas</strong>
        <span>540</span>
    </article>


    <article class="summary-card">
        <strong>Acierto medio</strong>
        <span>78%</span>
    </article>

</div>

</section>

<!-- EVOLUCION -->

<section class="section">

<h2>Evolución</h2>

<div class="filters">
    <button data-periodo="1">Hoy</button>
    <button data-periodo="7">7 días</button>
    <button data-periodo="30">30 días</button>
    <button data-periodo="total">Total</button>
</div>

<div class="card">

<canvas id="evolucionChart"></canvas>

</div>

</section>

<!-- TEMAS -->
<section class="section">

<h2>Rendimiento por temas</h2>

<div class="grid">

<article class="card">


<h3>Distribución de preguntas</h3>


<canvas id="temasDistribucionChart"></canvas>

</article>

<article class="card">

<h3>Acierto por tema</h3>


<canvas id="temasAciertoChart"></canvas>

</article>

</div>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/navbar.js"></script>

<script src="./js/seguimiento.js"></script>


</body>

</html>
