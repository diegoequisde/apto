<!DOCTYPE html>
<html lang="gl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APTO | Nuevo usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

</head>
<main>
    <section class="page-header">
        <h1>Crear cuenta</h1>
        <p>Empieza a preparar tus oposiciones.</p>
    </section>

    <section class="card login-card">

        <form id="registroForm">

            <label>
                Nombre
                <input type="text" id="nombre" required>
            </label>

            <label>
                Correo electrónico
                <input type="email" id="email" required>
            </label>

            <label>
                Contraseña
                <input type="password" id="password" minlength="6" required>
            </label>

            <label>
                Repetir contraseña
                <input type="password" id="repetirPassword" minlength="6" required>
            </label>

            <label>

                <input type="checkbox" id="privacidad" required>

                He leído y acepto la
                <a href="/legal/privacidad.html">
                    Política de privacidad
                </a>

            </label>

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <hr>

        <p>
            ¿Ya tienes cuenta?
            <a href="/auth/login.html">
                Iniciar sesión
            </a>
        </p>

    </section>
</main>
    <script src="/js/config.js"></script>
    <script src="/auth/js/auth.js"></script>

    <script>
        if (estaLogueado()) {
            window.location.href = '/index.html';
        }
    </script>
    
    <script src="/auth/js/registro.js"></script>
</body>

</html>
