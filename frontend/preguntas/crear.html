<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APTO | Nueva Pregunta</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">

    <!-- favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <section class="page-header">

<h1>Nueva pregunta</h1>
</section>
<section class = "card">

<select id="idTema"></select>

<br><br>

<textarea
    id="enunciado"
    rows="4"
></textarea>

<hr>

<h3>Opción A</h3>
<input type="text" id="texto-A">

<h3>Opción B</h3>
<input type="text" id="texto-B">

<h3>Opción C</h3>
<input type="text" id="texto-C">

<h3>Opción D</h3>
<input type="text" id="texto-D">

<hr>

<h3>Respuesta correcta</h3>

<label>
    <input
        type="radio"
        name="correcta"
        value="A"
    >
    A
</label>

<label>
    <input
        type="radio"
        name="correcta"
        value="B"
    >
    B
</label>

<label>
    <input
        type="radio"
        name="correcta"
        value="C"
    >
    C
</label>

<label>
    <input
        type="radio"
        name="correcta"
        value="D"
    >
    D
</label>

<br><br>

<button id="guardarBtn">
    Guardar
</button> 


        </section>

    </main>

    <div id="footer"></div>

    <script src="/js/navbar.js"></script>
    <script src="/js/footer.js"></script>
    <script src="./js/crear-pregunta.js"></script>

</body>

</html>
