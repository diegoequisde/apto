<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APTO | Preguntas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">

    <!-- favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <section class="page-header">
            <h1 id="tituloTema">Preguntas</h1>
            <p id="contadorPreguntas"></p>
        </section>

        <section class="card">
            <h2>Añadir nueva pregunta</h2>

            <div class="acciones">

                <button onclick="irCrearPregunta()">
                    Crear pregunta
                </button>
            </div>

            <hr>

            <div id="preguntasContainer"></div>

            <footer class="paginacion">

                <p id="infoPaginacion"></p>

                <div class="paginacion-botones">
                    <button id="anteriorBtn">Anterior</button>
                    <button id="siguienteBtn">Siguiente</button>
                </div>

            </footer>

        </section>

    </main>

    <div id="footer"></div>

    <script src="/js/config.js"></script>
    <script src="/auth/js/auth.js"></script>
    <script src="/js/loader.js"></script>
    <script src="./js/preguntas.js"></script>

</body>

</html>
