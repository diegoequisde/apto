<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APTO | Resultado del test</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

<link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div id="navbar"></div>

<main class="container">

<section class="page-header">


<h1>Resultado del test</h1>

<p>Resumen de tu simulacro</p>

</section>

<section class="grid">

<article class="card">


<h2>Aciertos</h2>

<p class="resultado-numero" id="aciertos">0</p>

</article>

<article class="card">

<h2>Errores</h2>

<p class="resultado-numero" id="errores">0</p>

</article>

<article class="card">

<h2>Nota</h2>

<p class="resultado-numero" id="nota">0%</p>

</article>

</section>

<section class="card">

<h2>Resumen</h2>

<ul>

<li>Preguntas contestadas:
<span id="totalPreguntas"></span>
</li>

<li>Tiempo empleado:<span id="tiempo"></span>
</li>

</ul>

</section>


<a href="/generar-test/index.html"
role="button"
>Nuevo test</a>


<a href="/seguimiento/index.html"
    role="button"
    class="secondary"
>Ver seguimiento</a>

</main>

<script src="/js/navbar.js"></script>
<script src="./js/resultado.js"></script>


</body>

</html>
