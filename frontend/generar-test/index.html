<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APTO | Generar Test</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <h1>Generar test</h1>

        <section class="card">

            <div class="generador-grid">

                <label>Oposición
                    <select id="oposicion"></select>
                </label>

                <label>Tema
                    <select id="tema"></select>
                </label>

                <label>Preguntas
                    <input type="number" id="cantidadTema" min="1" step="1" value="10">
                </label>

                <button id="anadirTemaBtn" class="secondary">
                    + Añadir este tema
                </button>

            </div>

            <div id="bloqueTemas" style="display:none;">

                <h2 id="tituloTemas">Temas seleccionados</h2>

                <div id="listaTemas"></div>

                <hr>

                <p id="totalPreguntas"></p>

            </div>

            <div class="acciones-generador">

                <label>Tiempo del test
                    <select id="duracion">
                        <option value="">Sin límite</option>
                        <option value="15">15 segundos(pruebas)</option>
                        <option value="300">5 minutos</option>
                        <option value="900">15 minutos</option>
                        <option value="1800">30 minutos</option>
                        <option value="2700">45 minutos</option>
                        <option value="3600">60 minutos</option>
                        <option value="5400">90 minutos</option>
                        <option value="7200">120 minutos</option>
                    </select>
                </label>

                <button id="generarBtn">
                    Generar test
                </button>

            </div>

        </section>

        <hr>

        <section class="card">

            <h2>Simulacros oficiais</h2>

            <div class="simulacros-grid">

                <article>

                    <h3>Administrativo Xunta C1</h3>

                    <p>120 preguntas · 120 minutos</p>

                    <button class="btnOficial" data-oposicion="2">
                        Realizar simulacro
                    </button>

                </article>

                <article>

                    <h3>Auxiliar Administrativo Xunta C2</h3>

                    <p>120 preguntas · 120 minutos</p>

                    <button class="btnOficial" data-oposicion="3">
                        Realizar simulacro
                    </button>

                </article>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script src="/js/config.js"></script>
    <script src="/auth/js/auth.js"></script>
    <script src="/js/loader.js"></script>
    <script src="./js/generar-test.js"></script>

</body>

</html>
