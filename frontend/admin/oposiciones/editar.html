<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APTO | Editar oposición</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="/css/styles.css">

<!-- favicon--> 
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

</head>
<body>

<div id="navbar"></div>

<main class="container">

    <section class="card">

        <h1>Editar oposición</h1>

        <label>
            Nombre
            <input type="text" id="nombreOposicion">
        </label>

        <label>
            Descripción
            <textarea id="descripcionOposicion" rows="5"></textarea>
        </label>

        <button id="guardarBtn">Guardar cambios</button>

    </section>

    <section class="card">

        <h2>Temas da oposición</h2>

        <div id="temasOposicionContainer"></div>

        <hr>

        <label>
            Añadir tema
            <select id="temaSelect"></select>

        </label>

        <button id="anadirTemaBtn">Añadir tema</button>

    </section>

</main>

<div id="footer"></div>

<script src="/js/config.js"></script>
<script src="/auth/js/auth.js"></script>
<script src="/js/loader.js"></script>
<script src="./js/editar-oposicion.js"></script>

</body>
</html>
