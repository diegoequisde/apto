<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar oposición</title>
</head>
<body>

<div id="navbar"></div>

<h1>Editar oposición</h1>

<input
    type="text"
    id="nombre"
/>

<br><br>

<textarea
    id="descripcion"
    rows="5"
></textarea>

<br><br>

<button id="guardarBtn">
    Guardar cambios
</button>

<hr>

<h2>Temas de la oposición</h2>

<div id="temasOposicionContainer"></div>

<hr>

<h2>Añadir tema</h2>

<select id="temaSelect"></select>

<button id="anadirTemaBtn">
    Añadir tema
</button>

<script src="/js/navbar.js"></script>
<script src="./js/editar-oposicion.js"></script>

</body>
</html>
