<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APTO | Editar oposición</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="/css/styles.css">

</head>
<body>

<div id="navbar"></div>

<h1>Editar oposición</h1>

<input
    type="text"
    id="nombreOposicion"
/>

<br><br>

<textarea
    id="descripcionOposicion"
    rows="5"
></textarea>

<br><br>

<button id="guardarBtn">
    Guardar cambios
</button>

<hr>

<h2>Temas de la oposición</h2>

<div id="temasOposicionContainer"></div>

<h2>Añadir tema</h2>

<select id="temaSelect"></select>

<button id="anadirTemaBtn">
    Añadir tema
</button>

<script src="/js/navbar.js"></script>
<script src="./js/editar-oposicion.js"></script>

</body>
</html>
