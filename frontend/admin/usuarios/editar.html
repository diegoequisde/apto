<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
</head>
<body>

<div id="navbar"></div>

<h1>Editar usuario</h1>

<label>
    Nombre
</label>

<br>

<input
    type="text"
    id="nombreUsuario"
>

<br><br>

<label>
    Email
</label>

<br>

<input
    type="email"
    id="emailUsuario"
>

<br><br>

<label>
    Tipo de usuario
</label>

<br>

<select id="tipoUsuario">

    <option value="free">
        Free
    </option>

    <option value="premium">
        Premium
    </option>

    <option value="admin">
        Admin
    </option>

</select>

<br><br>

<button id="guardarBtn">
    Guardar cambios
</button>

<script src="/js/navbar.js"></script>
<script src="./js/editar-usuario.js"></script>

</body>
</html>
